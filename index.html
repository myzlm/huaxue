<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学世界 · 古风雅集</title>
    <style>
        :root {
            --bg: #f5efe0;
            --panel: #fdfaf3;
            --text: #2c2c2c;
            --accent: #b03a2e;
            --accent2: #7b241c;
            --gold: #c9a84c;
            --ink: #1a1a1a;
            --border: #d4c5a9;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            --font-title: 'STKaiti', 'KaiTi', '楷体', '华文楷体', serif;
            --font-body: 'STSong', 'SimSun', '宋体', serif;
            --radius: 8px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 20% 30%, rgba(200,180,150,0.2) 0%, transparent 30%),
                              radial-gradient(circle at 80% 70%, rgba(200,180,150,0.3) 0%, transparent 40%);
        }
        /* 粒子背景 */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        /* 打字特效容器 */
        .typewriter-effect {
            position: fixed;
            z-index: 1001;
            pointer-events: none;
            font-family: var(--font-title);
            font-size: 1.2rem;
            color: var(--accent);
            background: rgba(255, 248, 230, 0.85);
            border: 1px solid var(--gold);
            border-radius: 12px;
            padding: 8px 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.5s;
            backdrop-filter: blur(3px);
        }
        #tw-top-right {
            top: 20px;
            right: 20px;
        }
        #tw-bottom-right {
            bottom: 20px;
            right: 20px;
        }
        #tw-top-left {
            top: 20px;
            left: 20px;
        }
        .typewriter-effect.show {
            opacity: 1;
        }
        #app {
            width: 95%;
            max-width: 1200px;
            background: var(--panel);
            margin: 20px auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 15px;
            position: relative;
            z-index: 10;
            overflow: hidden;
            backdrop-filter: blur(5px);
        }
        #app::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--accent), var(--gold), var(--accent));
            z-index: 2;

        #app::after {
            content: '';

            top: -2px;
            left: -2px;
            right: -2px;

<script>
// ==================== 粒子背景 ====================
(function() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    const particles = [];
    const PARTICLE_COUNT = 60;

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
        constructor() {
            this.reset();
        }
        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.size = Math.random() * 3 + 1;
            this.speedX = (Math.random() - 0.5) * 0.5;
            this.speedY = (Math.random() - 0.5) * 0.5;
            this.opacity = Math.random() * 0.5 + 0.2;
            this.color = `rgba(185, 140, 70, ${this.opacity})`;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                this.reset();
            }
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Particle());
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }
    animate();
})();

// ==================== 墨韵打字特效 ====================
const typewriterTexts = {
    topRight: [
        '千锤万凿出深山，烈火焚烧若等闲。',
        '粉骨碎身浑不怕，要留清白在人间。',
        '化学奥妙，变化无穷。'
    ],
    bottomRight: [
        '格物致知，诚意正心。',
        '纸上得来终觉浅，绝知此事要躬行。',
        '问渠那得清如许？为有源头活水来。'
    ],
    topLeft: [
        '路漫漫其修远兮，吾将上下而求索。',
        '学而不思则罔，思而不学则殆。',
        '博学之，审问之，慎思之，明辨之，笃行之。'
    ]
};

let typewriterTimers = [];

function clearTypewriterTimers() {
    typewriterTimers.forEach(timer => clearTimeout(timer));
    typewriterTimers = [];
}

function typeWriter(element, text, speed = 50, callback) {
    let i = 0;
    element.textContent = '';
    element.classList.add('show');
    function type() {
        if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            typewriterTimers.push(setTimeout(type, speed));
        } else {
            if (callback) callback();
        }
    }
    type();
}

function triggerTypewriters() {
    clearTypewriterTimers();
    const topRight = document.getElementById('tw-top-right');
    const bottomRight = document.getElementById('tw-bottom-right');
    const topLeft = document.getElementById('tw-top-left');

    // 隐藏所有
    [topRight, bottomRight, topLeft].forEach(el => el.classList.remove('show'));

    // 随机选取文本
    const trText = typewriterTexts.topRight[Math.floor(Math.random() * typewriterTexts.topRight.length)];
    const brText = typewriterTexts.bottomRight[Math.floor(Math.random() * typewriterTexts.bottomRight.length)];
    const tlText = typewriterTexts.topLeft[Math.floor(Math.random() * typewriterTexts.topLeft.length)];

    // 开始打字
    typeWriter(topRight, trText, 60, () => {
        typewriterTimers.push(setTimeout(() => topRight.classList.remove('show'), 2000));
    });
    typeWriter(bottomRight, brText, 60, () => {
        typewriterTimers.push(setTimeout(() => bottomRight.classList.remove('show'), 2000));
    });
    typeWriter(topLeft, tlText, 60, () => {
        typewriterTimers.push(setTimeout(() => topLeft.classList.remove('show'), 2000));
    });
}

// ==================== 数据加载与解析 ====================
let dataCache = {
    elements: [],
    equations: [],
    questions: [],
    molecules: [],
    radicals: [],
    changelog: ""
};
let atomicWeights = { exact: {}, approx: {} };
let dataLoaded = false;

async function loadDataFile(filename) {
    try {
        const res = await fetch(filename);
        if (!res.ok) throw new Error('File not found');
        return await res.text();
    } catch (e) {
        try {
            const res = await fetch('data/' + filename);
            if (!res.ok) throw new Error('File not found in data/');
            return await res.text();
        } catch (e2) {
            console.warn(`无法加载 ${filename}: ${e2.message}`);
            return null;
        }
    }
}

function parseElementsCSV(text) {
    const lines = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));
    const elements = [];
    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const parts = [];
        let current = '';
        let inQuotes = false;
        for (let ch of line) {
            if (ch === '"') {
                inQuotes = !inQuotes;
            } else if (ch === ',' && !inQuotes) {
                parts.push(current.trim());
                current = '';
            } else {
                current += ch;
            }
        }
        if (current) parts.push(current.trim());
        parts.forEach((p, idx) => parts[idx] = p.replace(/^"|"$/g, ''));
        if (parts.length < 6) continue;
        const symbol = parts[0].trim();
        const nameRaw = parts[1].trim();
        const name = nameRaw.split('(')[0].trim();
        const num = parts[2].replace(/\D/g, '');
        if (!symbol || !num) continue;
        const mass = parts[3] || '';
        const valence = parts[4] || '';
        const type = parts[5] || '';
        const group = parts[6] || '';
        const period = parts[7] || '';
        const electronConfig = parts[8] || '';
        const year = parts[9] || '';
        const discoverer = parts[10] || '';
        const properties = parts[11] || '';
        elements.push({ symbol, name, num, mass, valence, type, group, period, electronConfig, year, discoverer, properties });
    }
    elements.sort((a, b) => parseInt(a.num) - parseInt(b.num));
    return elements;
}

function parseSimpleCSV(text, minFields = 3) {
    const lines = text.split('\n').filter(l => l.trim() && !l.startsWith('#'));
    const result = [];
    for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const parts = line.split(',').map(p => p.trim());
        if (parts.length >= minFields) {
            result.push(parts);
        }
    }
    return result;
}

async function initData() {
    try {
        const [elemText, eqText, qText, molText, radText, logText] = await Promise.all([
            loadDataFile('原子.txt'),
            loadDataFile('方程式.txt'),
            loadDataFile('问题.txt'),
            loadDataFile('分子.txt'),
            loadDataFile('原子团.txt'),
            loadDataFile('更新日志.txt')
        ]);

        if (elemText) dataCache.elements = parseElementsCSV(elemText);
        if (eqText) dataCache.equations = parseSimpleCSV(eqText, 3).map(p => ({ type: p[0], equation: p[1], desc: p[2] || '' }));
        if (qText) dataCache.questions = parseSimpleCSV(qText, 8).map(p => ({ type: p[0], question: p[1], A: p[2], B: p[3], C: p[4], D: p[5], answer: p[6], explain: p[7] || '' }));
        if (molText) dataCache.molecules = parseSimpleCSV(molText, 5).map(p => ({ name: p[0], formula: p[1], weight: p[2], type: p[3], desc: p[4] || '' }));
        if (radText) dataCache.radicals = parseSimpleCSV(radText, 4).map(p => ({ name: p[0], formula: p[1], charge: p[2], desc: p[3] || '' }));
        if (logText) dataCache.changelog = logText;

        atomicWeights = { exact: {}, approx: {} };
        dataCache.elements.forEach(e => {
            const match = e.mass.match(/[\d.]+/);
            if (match) {
                const val = parseFloat(match[0]);
                atomicWeights.exact[e.symbol] = val;
                atomicWeights.approx[e.symbol] = Math.round(val);
            }
        });
        dataLoaded = true;
    } catch (err) {
        console.error('数据加载出错:', err);
        alert('数据加载失败，请确认txt文件与HTML同目录。');
    }
}

// ==================== 化学解析核心 ====================

    let charge = 0;
    let s = compound.trim();
    const chargePatterns = [
        { regex: /\((\d+[+-])\)$/, func: m => parseCharge(m[1]) },
        { regex: /\(([+-]\d*)\)$/, func: m => parseCharge(m[1]) },
        { regex: /\^(\d+[+-])$/, func: m => parseCharge(m[1]) },
        { regex: /\^([+-]\d*)$/, func: m => parseCharge(m[1]) },
        { regex: /(\d+[+-])$/, func: m => parseCharge(m[1]) },
        { regex: /([+-]\d*)$/, func: m => parseCharge(m[1]) },
    ];
    for (let pat of chargePatterns) {
        const m = s.match(pat.regex);
        if (m) {
            charge = pat.func(m);
            s = s.substring(0, m.index);
            break;
        }
    }
    if (charge === 0) {
        if (s.endsWith('+')) { charge = 1; s = s.slice(0, -1); }
        else if (s.endsWith('-')) { charge = -1; s = s.slice(0, -1); }
    }
    s = s.replace(/\[/g, '(').replace(/\]/g, ')');
    const elemRegex = /[A-Z][a-z]?/g;
    const stack = [{}];
    let i = 0;
    const n = s.length;
    function getNumber(pos) {
        let j = pos;
        while (j < n && /\d/.test(s[j])) j++;
        if (j === pos) return { count: 1, next: pos };
        return { count: parseInt(s.substring(pos, j)), next: j };
    }
    while (i < n) {
        const ch = s[i];
        if (ch === '(') {
            stack.push({});
            i++;
        } else if (ch === ')') {
            i++;
            const numRes = getNumber(i);
            const mult = numRes.count;
            i = numRes.next;
            const inner = stack.pop();
            for (let elem in inner) {
                stack[stack.length-1][elem] = (stack[stack.length-1][elem] || 0) + inner[elem] * mult;
            }
        } else if (/[A-Z]/.test(ch)) {
            elemRegex.lastIndex = i;
            const m = elemRegex.exec(s);
            if (!m || m.index !== i) throw new Error('无效元素符号');
            const elem = m[0];
            i = m.index + elem.length;
            const numRes = getNumber(i);
            const cnt = numRes.count;
            i = numRes.next;
            stack[stack.length-1][elem] = (stack[stack.length-1][elem] || 0) + cnt;
        } else if (/\s/.test(ch)) {
            i++;
        } else {
            throw new Error('非法字符: ' + ch);
        }
    }
    if (stack.length !== 1) throw new Error('括号不匹配');
    return { counts: stack[0], charge };
}

function parseCharge(token) {
    token = token.trim();
    if (!token) return 0;
    let sign = 1;
    let numStr = '';
    if (token.includes('+')) { sign = 1; numStr = token.replace('+', ''); }
    else if (token.includes('-')) { sign = -1; numStr = token.replace('-', ''); }
    const num = numStr ? parseInt(numStr) : 1;
    return sign * num;
}

function autoFormatEquation(raw) {
    let s = raw.replace(/=/g, '->');
    const chargeRegex = /(\^\s*\d+[+\-]|\^\s*[+\-]\d*|\(\s*\d+[+\-]\s*\)|\(\s*[+\-]\d*\s*\)|\d+[+\-]|[+\-]\d*)/g;
    const charges = [];
    s = s.replace(chargeRegex, match => {
        charges.push(match);
        return `<<<${charges.length-1}>>>`;
    });
    s = s.replace(/\+/g, ' + ').replace(/->/g, ' -> ');
    charges.forEach((chg, idx) => {
        s = s.replace(`<<<${idx}>>>`, chg);
    });
    return s.replace(/\s+/g, ' ').trim();
}

function normalizeEquation(eqStr) {
    eqStr = autoFormatEquation(eqStr);
    if (!eqStr.includes('->')) return null;
    const [left, right] = eqStr.split('->');
    const reactants = left.split('+').map(s => s.trim()).filter(s => s).map(s => s.replace(/^\d+/, '').trim());
    const products = right.split('+').map(s => s.trim()).filter(s => s).map(s => s.replace(/^\d+/, '').trim());
    const normEq = reactants.join(' + ') + ' -> ' + products.join(' + ');
    return { normEq, reactants, products };
}

class Fraction {
    constructor(num, den = 1n) {
        if (typeof num === 'number') num = BigInt(num);
        if (typeof den === 'number') den = BigInt(den);
        if (den < 0n) { num = -num; den = -den; }
        const g = gcdBigInt(num, den);
        this.num = num / g;
        this.den = den / g;
    }
    add(other) { return new Fraction(this.num * other.den + other.num * this.den, this.den * other.den); }
    sub(other) { return new Fraction(this.num * other.den - other.num * this.den, this.den * other.den); }
    mul(other) { return new Fraction(this.num * other.num, this.den * other.den); }
    div(other) { return new Fraction(this.num * other.den, this.den * other.num); }
    isZero() { return this.num === 0n; }
    isNegative() { return this.num < 0n; }
    isPositive() { return this.num > 0n; }
    toNumber() { return Number(this.num) / Number(this.den); }
}
function gcdBigInt(a, b) {
    a = a < 0n ? -a : a;
    b = b < 0n ? -b : b;
    while (b) { [a, b] = [b, a % b]; }
    return a;
}
function lcmBigInt(a, b) { return (a * b) / gcdBigInt(a, b); }

function fractionArrayToInt(arr) {
    const dens = arr.map(f => f.den);
    let lcm = 1n;
    dens.forEach(d => lcm = lcm * d / gcdBigInt(lcm, d));
    const ints = arr.map(f => f.num * (lcm / f.den));
    let g = ints[0];
    for (let i = 1; i < ints.length; i++) g = gcdBigInt(g, ints[i]);
    return ints.map(x => Number(x / g));
}

function balanceNullspace(reactants, products) {
    const rCounts = reactants.map(r => parseCompound(r).counts);
    const pCounts = products.map(p => parseCompound(p).counts);
    const rCharges = reactants.map(r => parseCompound(r).charge);
    const pCharges = products.map(p => parseCompound(p).charge);
    const allElements = new Set();
    rCounts.forEach(d => Object.keys(d).forEach(e => allElements.add(e)));
    pCounts.forEach(d => Object.keys(d).forEach(e => allElements.add(e)));
    const elements = Array.from(allElements).sort();
    const includeCharge = rCharges.some(c => c !== 0) || pCharges.some(c => c !== 0);
    const nR = reactants.length, nP = products.length;
    const nVars = nR + nP;
    const A = [];
    elements.forEach(e => {
        const row = [];
        for (let i = 0; i < nR; i++) row.push(new Fraction(rCounts[i][e] || 0));
        for (let j = 0; j < nP; j++) row.push(new Fraction(-(pCounts[j][e] || 0)));
        A.push(row);
    });
    if (includeCharge) {
        const row = [];
        for (let i = 0; i < nR; i++) row.push(new Fraction(rCharges[i]));
        for (let j = 0; j < nP; j++) row.push(new Fraction(-pCharges[j]));
        A.push(row);
    }
    if (A.length === 0) throw new Error('无元素或电荷信息');
    const rows = A.length, cols = nVars;
    let M = A.map(row => row.slice());
    let pivotRow = 0, pivotCol = 0;
    while (pivotRow < rows && pivotCol < cols) {
        let found = -1;
        for (let r = pivotRow; r < rows; r++) {
            if (!M[r][pivotCol].isZero()) { found = r; break; }
        }
        if (found === -1) { pivotCol++; continue; }
        [M[pivotRow], M[found]] = [M[found], M[pivotRow]];
        const pivot = M[pivotRow][pivotCol];
        for (let c = pivotCol; c < cols; c++) M[pivotRow][c] = M[pivotRow][c].div(pivot);
        for (let r = 0; r < rows; r++) {
            if (r !== pivotRow && !M[r][pivotCol].isZero()) {
                const factor = M[r][pivotCol];
                for (let c = pivotCol; c < cols; c++) {
                    M[r][c] = M[r][c].sub(factor.mul(M[pivotRow][c]));
                }
            }
        }
        pivotRow++; pivotCol++;
    }
    const pivotCols = [];
    let r = 0;
    for (let c = 0; c < cols; c++) {
        if (r < rows && !M[r][c].isZero()) {
            pivotCols.push(c);
            r++;
        }
    }
    const freeVars = [];
    for (let c = 0; c < cols; c++) if (!pivotCols.includes(c)) freeVars.push(c);
    if (freeVars.length === 0) throw new Error('无自由变量，无法配平');
    for (let base of freeVars) {
        const x = Array(cols).fill().map(() => new Fraction(0));
        x[base] = new Fraction(1);
        for (let i = pivotCols.length - 1; i >= 0; i--) {
            const pc = pivotCols[i];
            let total = new Fraction(0);
            for (let c = pc + 1; c < cols; c++) {
                total = total.add(M[i][c].mul(x[c]));
            }
            x[pc] = total.mul(new Fraction(-1));
        }
        let allPositive = true;
        for (let v of x) if (!v.isPositive()) { allPositive = false; break; }
        if (allPositive) {
            const ints = fractionArrayToInt(x);
            return { rCoeffs: ints.slice(0, nR), pCoeffs: ints.slice(nR) };
        }
        let allNegative = true;
        for (let v of x) if (!v.isNegative() && !v.isZero()) { allNegative = false; break; }
        if (allNegative) {
            const negX = x.map(v => v.mul(new Fraction(-1)));
            const ints = fractionArrayToInt(negX);
            return { rCoeffs: ints.slice(0, nR), pCoeffs: ints.slice(nR) };
        }
    }
    throw new Error('无全正系数解，反应物/生成物可能不对');
}

function verifyBalance(reactants, products, rCoeffs, pCoeffs) {
    const rCounts = reactants.map(r => parseCompound(r).counts);
    const pCounts = products.map(p => parseCompound(p).counts);
    const rCharges = reactants.map(r => parseCompound(r).charge);
    const pCharges = products.map(p => parseCompound(p).charge);
    const allElements = new Set();
    rCounts.forEach(d => Object.keys(d).forEach(e => allElements.add(e)));
    pCounts.forEach(d => Object.keys(d).forEach(e => allElements.add(e)));
    let balanced = true;
    let details = [];
    for (let e of allElements) {
        let left = 0, right = 0;
        for (let i = 0; i < reactants.length; i++) left += rCoeffs[i] * (rCounts[i][e] || 0);
        for (let j = 0; j < products.length; j++) right += pCoeffs[j] * (pCounts[j][e] || 0);
        if (left !== right) { balanced = false; details.push(`❌ ${e}: ${left} ≠ ${right}`); }
        else details.push(`✅ ${e}: ${left} = ${right}`);
    }
    let leftCharge = 0, rightCharge = 0;
    for (let i = 0; i < reactants.length; i++) leftCharge += rCoeffs[i] * rCharges[i];
    for (let j = 0; j < products.length; j++) rightCharge += pCoeffs[j] * pCharges[j];
    if (leftCharge !== rightCharge) { balanced = false; details.push(`❌ 电荷: ${leftCharge} ≠ ${rightCharge}`); }
    else details.push(`✅ 电荷: ${leftCharge} = ${rightCharge}`);
    return { balanced, details: details.join('\n') };
}

function calculateMolecularWeight(formula, aw) {
    const { counts } = parseCompound(formula);
    let mass = 0;
    let unknown = [];
    for (let elem in counts) {
        if (aw[elem]) mass += aw[elem] * counts[elem];
        else unknown.push(elem);
    }
    if (unknown.length) throw new Error('未知元素: ' + unknown.join(', '));
    return { mass, counts };
}

function renderCalculator(container) {
    if (!dataLoaded) { container.innerHTML = '<p>数据加载中...</p>'; return; }
    addBackButton(container);
    const title = document.createElement('h2');
    title.textContent = '相对质量计算';
    title.style.fontFamily = 'var(--font-title)';
    title.style.color = 'var(--accent)';
    container.appendChild(title);

    const modeDiv = document.createElement('div');
    modeDiv.innerHTML = `
        <label>模式:</label>
        <select id="calcMode">
            <option value="formula">化学式</option>
            <option value="equation">化学方程式</option>
        </select>
        <label style="margin-left:15px;">原子量:</label>
        <select id="weightMode">
            <option value="exact">精确值</option>
            <option value="approx">近似值</option>
        </select>
    `;
    container.appendChild(modeDiv);

    const formulaPanel = document.createElement('div');
    formulaPanel.id = 'formulaPanel';
    formulaPanel.innerHTML = `
        <div style="margin-top:10px;">
            <label>化学式:</label>
            <input type="text" id="formulaInput" placeholder="如 H2O, MnO4-" style="width:200px;">
            <span style="color:#888; margin-left:10px;">例: H2O, MnO4-</span>
        </div>
        <div style="margin-top:10px;">
            <label>扩展:</label>
            <select id="calcExtMode">
                <option value="massOnly">仅质量</option>
                <option value="totalMass">按总质量</option>
                <option value="elemMass">按元素质量</option>
            </select>
            <span id="totalMassInput" style="display:none;">
                <label>总质量:</label>
                <input type="number" id="totalMassVal" step="any" style="width:80px;">
            </span>
            <span id="elemMassInput" style="display:none;">
                <label>元素:</label>
                <input type="text" id="elemNameVal" style="width:50px;">
                <label>质量:</label>
                <input type="number" id="elemMassVal" step="any" style="width:80px;">
            </span>
        </div>
        <button class="btn btn-primary" id="calcFormulaBtn">计算</button>
    `;
    container.appendChild(formulaPanel);

    const eqPanel = document.createElement('div');
    eqPanel.id = 'eqPanel';
    eqPanel.style.display = 'none';
    eqPanel.innerHTML = `
        <div style="margin-top:10px;">
            <label>方程式:</label>
            <input type="text" id="eqInput" placeholder="如 2H2 + O2 -> 2H2O" style="width:300px;">
            <span style="color:#888; margin-left:10px;">例: 2H2 + O2 -> 2H2O</span>
        </div>
        <button class="btn btn-primary" id="calcEqBtn">计算</button>
    `;
    container.appendChild(eqPanel);

    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';
    resultBox.id = 'calcResultBox';
    resultBox.style.marginTop = '15px';
    resultBox.style.minHeight = '150px';
    container.appendChild(resultBox);

    document.getElementById('calcMode').addEventListener('change', function() {
        if (this.value === 'formula') { formulaPanel.style.display = 'block'; eqPanel.style.display = 'none'; }
        else { formulaPanel.style.display = 'none'; eqPanel.style.display = 'block'; }
    });
    document.getElementById('calcExtMode').addEventListener('change', function() {
        document.getElementById('totalMassInput').style.display = this.value === 'totalMass' ? 'inline' : 'none';
        document.getElementById('elemMassInput').style.display = this.value === 'elemMass' ? 'inline' : 'none';
    });

    const aw = () => (document.getElementById('weightMode').value === 'approx' ? atomicWeights.approx : atomicWeights.exact);

    document.getElementById('calcFormulaBtn').onclick = () => {
        const formula = document.getElementById('formulaInput').value.trim();
        if (!formula) { resultBox.innerHTML = '请输入化学式'; return; }
        const weights = aw();
        try {
            const { mass, counts } = calculateMolecularWeight(formula, weights);
            let output = `化学式: ${formula}  |  原子量: ${document.getElementById('weightMode').value}\n`;
            output += '元素组成:\n';
            for (let el in counts) output += `  ${el}: ${counts[el]}\n`;
            output += `\n相对质量 = ${mass.toFixed(4)}\n`;
            output += '\n--- 质量分数 ---\n';
            for (let el in counts) {
                const elMass = weights[el] * counts[el];
                output += `${el}: ${elMass.toFixed(4)} (${(elMass/mass*100).toFixed(2)}%)\n`;
            }
            const extMode = document.getElementById('calcExtMode').value;
            if (extMode === 'totalMass') {
                const total = parseFloat(document.getElementById('totalMassVal').value);
                if (!isNaN(total)) {
                    output += `\n--- 总质量 = ${total} ---\n`;
                    for (let el in counts) { const g = weights[el] * counts[el] / mass * total; output += `${el}: ${g.toFixed(4)}\n`; }
                } else output += '\n⚠ 总质量输入无效';
            } else if (extMode === 'elemMass') {
                const el = document.getElementById('elemNameVal').value.trim();
                const m = parseFloat(document.getElementById('elemMassVal').value);
                if (el && !isNaN(m)) {
                    if (!(el in counts)) output += `\n⚠ 元素 ${el} 不在该化学式中`;
                    else {
                        const factor = m / (weights[el] * counts[el]);
                        const total = factor * mass;
                        output += `\n--- 由 ${el} 质量 ${m} 推算 (总质量: ${total.toFixed(4)}) ---\n`;
                        for (let other in counts) { const otherMass = weights[other] * counts[other] * factor; output += `${other}: ${otherMass.toFixed(4)}\n`; }
                    }
                } else output += '\n⚠ 元素质量输入无效';
            }
            resultBox.innerHTML = output;
        } catch (e) { resultBox.innerHTML = '错误: ' + e.message; }
    };

    document.getElementById('calcEqBtn').onclick = () => {
        const eqStr = document.getElementById('eqInput').value.trim();
        if (!eqStr) { resultBox.innerHTML = '请输入化学方程式'; return; }
        const formatted = autoFormatEquation(eqStr);
        if (!formatted.includes('->')) { resultBox.innerHTML = '方程式需包含 ->'; return; }
        const [left, right] = formatted.split('->');
        function parseSpecies(side) {
            return side.split('+').map(s => s.trim()).filter(s => s).map(part => {
                const m = part.match(/^(\d+)(.*)/);
                if (m) return { coeff: parseInt(m[1]), formula: m[2].trim() };
                return { coeff: 1, formula: part.trim() };
            }).filter(sp => sp.formula);
        }
        const reactants = parseSpecies(left);
        const products = parseSpecies(right);
        const weights = aw();
        let output = `方程式: ${formatted}  |  原子量: ${document.getElementById('weightMode').value}\n`;
        function showList(lst) {
            lst.forEach(sp => {
                try { const { mass } = calculateMolecularWeight(sp.formula, weights); output += `  ${sp.coeff}${sp.formula}  Mr=${mass.toFixed(4)}\n`; }
                catch(e) { output += `  ${sp.coeff}${sp.formula}  计算失败: ${e.message}\n`; }
            });
        }
        output += '反应物:\n'; showList(reactants);
        output += '生成物:\n'; showList(products);
        output += '\n提示: 计量计算请使用“化学式配平”模块。';
        resultBox.innerHTML = output;
    };
}

function renderBalance(container) {
    if (!dataLoaded) { container.innerHTML = '<p>数据加载中...</p>'; return; }
    addBackButton(container);
    const title = document.createElement('h2');
    title.textContent = '化学式配平';

    title.style.color = 'var(--accent)';
    container.appendChild(title);

    const inputRow = document.createElement('div');
    inputRow.innerHTML = `
        <label>方程式:</label>
        <input type="text" id="balanceInput" placeholder="如 MnO4- + H2C2O4 + H+ -> Mn2+ + CO2 + H2O" style="width:400px;">
        <button class="btn btn-primary" id="balanceBtn">配平</button>
        <button class="btn" id="balanceClearBtn">清空</button>
        <button class="btn" id="balanceManualBtn">手动录入</button>
        <button class="btn" id="balanceSaveBtn">保存记录</button>
    `;
    container.appendChild(inputRow);

    const exampleRow = document.createElement('div');
    exampleRow.style.marginTop = '8px';
    exampleRow.innerHTML = `
        <button class="btn" data-ex="MnO4- + H2C2O4 + H+ -> Mn2+ + CO2 + H2O">高锰酸钾草酸</button>
        <button class="btn" data-ex="KMnO4 + H2O2 + H2SO4 -> MnSO4 + K2SO4 + O2 + H2O">高锰酸钾双氧水</button>
        <button class="btn" data-ex="Cu + HNO3 -> Cu(NO3)2 + NO + H2O">铜稀硝酸</button>
    `;
    container.appendChild(exampleRow);
    exampleRow.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => document.getElementById('balanceInput').value = btn.dataset.ex;
    });

    const resultBox = document.createElement('div');
    resultBox.className = 'result-box';
    resultBox.id = 'balanceResultBox';
    resultBox.style.marginTop = '15px';
    resultBox.style.minHeight = '200px';
    container.appendChild(resultBox);

    const verifyLabel = document.createElement('div');
    verifyLabel.id = 'balanceVerifyLabel';
    verifyLabel.style.marginTop = '10px';
    container.appendChild(verifyLabel);

    let currentData = {};

    document.getElementById('balanceBtn').onclick = () => {
        const eqStr = document.getElementById('balanceInput').value.trim();
        if (!eqStr) { resultBox.innerHTML = '请输入方程式'; return; }
        const norm = normalizeEquation(eqStr);
        if (!norm) { resultBox.innerHTML = '方程式需包含 -> 或 ='; return; }
        try {
            const { rCoeffs, pCoeffs } = balanceNullspace(norm.reactants, norm.products);
            const verify = verifyBalance(norm.reactants, norm.products, rCoeffs, pCoeffs);
            const rStr = norm.reactants.map((r, i) => (rCoeffs[i] > 1 ? rCoeffs[i] : '') + r).join(' + ');
            const pStr = norm.products.map((p, i) => (pCoeffs[i] > 1 ? pCoeffs[i] : '') + p).join(' + ');
            const balanced = rStr + ' -> ' + pStr;
            let output = `⚡ 配平成功\n\n原输入: ${eqStr}\n配平结果: ${balanced}\n反应物系数: [${rCoeffs}]\n生成物系数: [${pCoeffs}]`;
            resultBox.innerHTML = output;
            verifyLabel.innerHTML = verify.details.replace(/\n/g, '<br>');
            verifyLabel.style.color = verify.balanced ? 'green' : 'red';
            currentData = { reactants: norm.reactants, products: norm.products, rCoeffs, pCoeffs, balancedEq: balanced, verified: verify.balanced };
        } catch (e) {
            resultBox.innerHTML = '❌ 配平异常: ' + e.message;
            verifyLabel.innerHTML = '';
        }
    };

    document.getElementById('balanceClearBtn').onclick = () => {
        document.getElementById('balanceInput').value = '';
        resultBox.innerHTML = '';
        verifyLabel.innerHTML = '';
        currentData = {};
    };

    document.getElementById('balanceManualBtn').onclick = () => {
        const eqStr = document.getElementById('balanceInput').value.trim();
        const norm = normalizeEquation(eqStr);
        if (!norm) { alert('方程式无效'); return; }
        const rCoeffs = [], pCoeffs = [];
        for (let r of norm.reactants) {
            const val = prompt(`请输入反应物 ${r} 的系数:`);
            if (val === null) return;
            const n = parseInt(val);
            if (isNaN(n) || n <= 0) { alert('系数须为正整数'); return; }
            rCoeffs.push(n);
        }
        for (let p of norm.products) {
            const val = prompt(`请输入生成物 ${p} 的系数:`);
            if (val === null) return;
            const n = parseInt(val);
            if (isNaN(n) || n <= 0) { alert('系数须为正整数'); return; }
            pCoeffs.push(n);
        }
        const verify = verifyBalance(norm.reactants, norm.products, rCoeffs, pCoeffs);
        if (!verify.balanced) { alert('不守恒:\n' + verify.details); return; }
        const rStr = norm.reactants.map((r, i) => (rCoeffs[i] > 1 ? rCoeffs[i] : '') + r).join(' + ');
        const pStr = norm.products.map((p, i) => (pCoeffs[i] > 1 ? pCoeffs[i] : '') + p).join(' + ');
        const balanced = rStr + ' -> ' + pStr;
        resultBox.innerHTML = `✏️ 手动配平结果\n${balanced}\n系数: [${rCoeffs}] -> [${pCoeffs}]`;
        verifyLabel.innerHTML = verify.details.replace(/\n/g, '<br>');
        verifyLabel.style.color = 'green';
        currentData = { reactants: norm.reactants, products: norm.products, rCoeffs, pCoeffs, balancedEq: balanced, verified: true };
    };

    document.getElementById('balanceSaveBtn').onclick = () => {
        if (!currentData.balancedEq) { alert('没有可保存的方程式'); return; }
        const record = `时间: ${new Date().toLocaleString()}\n${currentData.balancedEq}\n检验:\n${verifyLabel.textContent}\n\n`;
        localStorage.setItem('balanceRecords', (localStorage.getItem('balanceRecords') || '') + record);
        alert('已保存到本地记录');
    };
}

function renderPractice(container) {
    if (!dataLoaded) { container.innerHTML = '<p>数据加载中...</p>'; return; }
    addBackButton(container);
    const title = document.createElement('h2');
    title.textContent = '练一练';
    title.style.fontFamily = 'var(--font-title)';
    title.style.color = 'var(--accent)';
    container.appendChild(title);

    if (!dataCache.questions.length) {
        container.innerHTML += '<p>题库为空，请检查问题.txt</p>';
        return;
    }

    let currentQuestions = [], currentIndex = 0, score = 0, wrongList = [];

    const setupDiv = document.createElement('div');
    setupDiv.innerHTML = `
        <label>学科:</label>
        <select id="practiceType">
            <option value="all">全部</option>
            ${[...new Set(dataCache.questions.map(q => q.type))].map(t => `<option value="${t}">${t}</option>`).join('')}
        </select>
        <label style="margin-left:10px;">题数:</label>
        <input type="number" id="practiceCount" value="10" min="1" style="width:60px;">
        <button class="btn btn-primary" id="practiceStart">开始练习</button>
    `;
    container.appendChild(setupDiv);

    const questionLabel = document.createElement('div');
    questionLabel.id = 'practiceQuestion';
    questionLabel.style.cssText = 'margin-top:20px; font-size:1.2rem; font-weight:bold;';
    container.appendChild(questionLabel);

    const optionsDiv = document.createElement('div');
    optionsDiv.id = 'practiceOptions';
    optionsDiv.style.cssText = 'margin-top:15px;';
    container.appendChild(optionsDiv);

    const feedback = document.createElement('div');
    feedback.id = 'practiceFeedback';
    feedback.style.cssText = 'margin-top:15px; color: #888;';
    container.appendChild(feedback);

    const progress = document.createElement('div');
    progress.id = 'practiceProgress';
    progress.style.cssText = 'margin-top:10px;';
    container.appendChild(progress);

    const submitBtn = document.createElement('button');
    submitBtn.className = 'btn btn-primary';
    submitBtn.textContent = '提交答案';
    submitBtn.id = 'practiceSubmit';
    submitBtn.style.marginTop = '15px';
    container.appendChild(submitBtn);

    let selectedOption = '';

    function startPractice() {
        const type = document.getElementById('practiceType').value;
        let pool = type === 'all' ? dataCache.questions : dataCache.questions.filter(q => q.type === type);
        let count = parseInt(document.getElementById('practiceCount').value) || 10;
        if (count > pool.length) count = pool.length;
        if (count === 0) { feedback.textContent = '无题可选'; return; }
        pool = [...pool];
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        currentQuestions = pool.slice(0, count);
        currentIndex = 0; score = 0; wrongList = [];
        showQuestion();
    }

    function showQuestion() {
        if (currentIndex >= currentQuestions.length) { showResult(); return; }
        const q = currentQuestions[currentIndex];
        questionLabel.textContent = `第${currentIndex + 1}题: ${q.question}`;
        optionsDiv.innerHTML = '';
        selectedOption = '';
        ['A', 'B', 'C', 'D'].forEach(letter => {
            const label = document.createElement('label');
            label.style.cssText = 'display:block; margin:5px 0; cursor:pointer;';
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'practiceOption';
            radio.value = letter;
            radio.onclick = () => selectedOption = letter;
            label.appendChild(radio);
            label.appendChild(document.createTextNode(` ${letter}. ${q[letter]}`));
            optionsDiv.appendChild(label);
        });
        feedback.textContent = '';
        progress.textContent = `进度: ${currentIndex + 1}/${currentQuestions.length}  | 得分: ${score}`;
    }

    function showResult() {
        const total = currentQuestions.length;
        questionLabel.textContent = '练习结束！';
        optionsDiv.innerHTML = '';
        let result = `得分: ${score}/${total} (正确率 ${(score/total*100).toFixed(1)}%)`;
        if (wrongList.length) result += '\n错题: ' + wrongList.map(q => `${q.question} (答案:${q.answer})`).join('；');
        feedback.textContent = result;
        feedback.style.color = 'var(--accent)';
        progress.textContent = '';
    }

    document.getElementById('practiceStart').onclick = startPractice;
    document.getElementById('practiceSubmit').onclick = () => {
        if (!selectedOption) { feedback.textContent = '请选择一个选项'; feedback.style.color = 'red'; return; }
        const q = currentQuestions[currentIndex];
        if (selectedOption === q.answer.trim()) {
            feedback.textContent = '✅ 正确！';
            feedback.style.color = 'green';
            score++;
        } else {
            feedback.textContent = `❌ 错误！正确答案 ${q.answer}. ${q.explain}`;
            feedback.style.color = 'red';
            wrongList.push(q);
        }
        currentIndex++;
        setTimeout(showQuestion, 1500);
    };
}
