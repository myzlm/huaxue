<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>化学世界 · 雅集</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
<style>
    /* ===== 重置 & 基础 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg-0: #1e1307;
        --bg-1: #2f1f0e;
        --bg-2: #1f140a;
        --line: #4d3820;
        --line-soft: #3d2b18;
        --gold: #c9a86a;
        --gold-lt: #eace9f;
        --gold-dim: #a6885a;
        --ink: #f0e6d3;
        --ink-2: #e8ddcc;
        --ink-3: #d4c09a;
        --muted: #8a7a5a;
        --ok: #7ac77a;
        --err: #d97a5a;
        --warn: #eace6a;
        --seal: #b23a2a;
    }
    body {
        font-family: 'Noto Serif SC', 'Songti SC', serif;
        background: #1e1307;
        background-image: radial-gradient(ellipse at 20% 50%, #3d2b17 0%, #1a0f05 100%);
        min-height: 100vh;
        color: var(--ink);
        padding: 16px;
        overflow-x: hidden;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M10 10 Q 30 5, 40 20 T 70 15 T 90 30" stroke="rgba(180,140,80,0.05)" stroke-width="2" fill="none"/><path d="M5 80 Q 25 70, 35 85 T 65 75 T 85 90" stroke="rgba(180,140,80,0.04)" stroke-width="2" fill="none"/><circle cx="80" cy="20" r="4" fill="rgba(180,140,80,0.03)"/><circle cx="15" cy="70" r="6" fill="rgba(180,140,80,0.03)"/></svg>');
        background-size: 300px 300px;
        opacity: .3;
        pointer-events: none;
        z-index: 0;
    }

    .scroll-container {
        max-width: 1300px;
        width: 100%;
        min-width: 0;
        background: linear-gradient(165deg, #2f1f0e 0%, #1f1308 100%);
        border: 8px double #b8945a;
        border-radius: 48px 48px 32px 32px;
        padding: 30px 30px 28px;
        box-shadow: 0 30px 80px rgba(0,0,0,.9), inset 0 0 120px rgba(180,140,80,.06);
        position: relative;
        z-index: 1;
    }
    .scroll-container::before {
        content: '';
        position: absolute; top: -14px; left: 15%; right: 15%; height: 14px;
        background: linear-gradient(90deg, transparent, #c9a86a, #e6d4a0, #c9a86a, transparent);
        border-radius: 50%; opacity: .3; filter: blur(2px);
    }
    .scroll-container::after {
        content: '';
        position: absolute; bottom: -14px; left: 20%; right: 20%; height: 8px;
        background: linear-gradient(90deg, transparent, #8a6f42, #b8945a, #8a6f42, transparent);
        border-radius: 50%; opacity: .2; filter: blur(2px);
    }
    .screen-seal {
        position: absolute; top: 18px; right: 26px;
        font-size: .68rem; color: var(--gold-dim); letter-spacing: 2px;
        border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px;
        background: rgba(20,14,6,.6);
    }
    .badge-row { text-align: center; margin: -10px 0 14px; }
    .data-badge {
        display: inline-block; cursor: help; font-size: .7rem; letter-spacing: 2px;
        color: var(--gold-dim); border: 1px solid var(--line); border-radius: 20px;
        padding: 1px 12px; background: rgba(20,14,6,.6);
    }
    .data-badge.ok { color: #9ecf9e; border-color: #3f5a33; }
    .data-badge.bad { color: var(--err); border-color: #6b3a2a; }

    .main-title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 2.9rem;
        text-align: center;
        color: #f5e6c8;
        text-shadow: 0 0 30px rgba(200,160,80,.3), 0 6px 12px rgba(0,0,0,.7);
        letter-spacing: 14px;
        padding-bottom: 6px;
        border-bottom: 2px solid #6a4f2e;
        position: relative;
    }
    .main-title small {
        font-size: .95rem; letter-spacing: 6px; color: var(--gold);
        display: block; font-family: 'Noto Serif SC', serif; font-weight: 400;
        margin-top: 6px; text-shadow: 0 2px 4px rgba(0,0,0,.5);
    }
    .main-title .seal {
        display: inline-block; margin-left: 10px; font-size: .75rem;
        background: var(--seal); color: var(--ink); padding: 2px 10px;
        border-radius: 4px; transform: rotate(-6deg);
        font-family: 'Ma Shan Zheng', cursive; letter-spacing: 2px;
        vertical-align: middle; opacity: .9;
    }
    .sub-charm {
        text-align: center; color: var(--gold); font-size: .85rem;
        letter-spacing: 9px; margin: 4px 0 14px; opacity: .6; font-weight: 300;
    }

    /* ===== 菜单 ===== */
    .menu-group { margin-bottom: 12px; }
    .group-label {
        font-size: .72rem; letter-spacing: 4px; color: var(--muted);
        margin: 6px 0 6px 4px; font-weight: 700;
    }
    .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
    }
    .menu-btn {
        background: linear-gradient(145deg, #3d2b18, #25190d);
        border: 1px solid #6a4f2e;
        border-radius: 14px;
        color: var(--gold-lt);
        font-family: 'Noto Serif SC', serif;
        font-size: .95rem; font-weight: 700;
        padding: 12px 6px;
        cursor: pointer;
        transition: all .25s cubic-bezier(.25,.46,.45,.94);
        box-shadow: 0 6px 16px rgba(0,0,0,.5);
        letter-spacing: 1px;
        position: relative; overflow: hidden;
    }
    .menu-btn::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(135deg, rgba(180,140,80,.1), transparent);
        pointer-events: none;
    }
    .menu-btn:hover {
        transform: translateY(-3px) scale(1.02);
        background: linear-gradient(145deg, #5a3d22, #3d2b18);
        border-color: #b8945a;
        box-shadow: 0 12px 28px rgba(180,140,80,.22);
        color: #f5e6c8;
    }
    .menu-btn:active { transform: scale(.97); }
    .menu-btn.active {
        background: linear-gradient(145deg, #6a4f2e, #4a3418);
        border-color: var(--gold);
        color: #fff3d8;
        box-shadow: 0 0 0 1px rgba(201,168,106,.4), 0 10px 24px rgba(180,140,80,.25);
    }
    .menu-btn .icon { display: block; font-size: 1.4rem; margin-bottom: 2px; }

    /* ===== 面板 ===== */
    .panel {
        min-width: 0;
        background: rgba(26,18,10,.82);
        border: 1px solid var(--line);
        border-radius: 26px;
        padding: 24px 24px 26px;
        margin-top: 18px;
        backdrop-filter: blur(4px);
        box-shadow: inset 0 0 80px rgba(0,0,0,.4), 0 8px 32px rgba(0,0,0,.5);
        min-height: 300px;
    }
    .panel-title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.9rem; color: #f5e6c8;
        border-bottom: 2px solid #5a3f22;
        padding-bottom: 10px; margin-bottom: 16px;
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        text-shadow: 0 2px 4px rgba(0,0,0,.3);
    }
    .panel-title .sub {
        font-size: .8rem; color: var(--gold); font-family: 'Noto Serif SC', serif;
        font-weight: 400; margin-left: auto; letter-spacing: 1px;
    }
    .fade-in { animation: fadeIn .28s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ===== 子标签 ===== */
    .tabbar {
        display: flex; flex-wrap: wrap; gap: 6px;
        padding: 8px; margin-bottom: 16px;
        background: rgba(20,14,6,.6);
        border: 1px solid var(--line-soft);
        border-radius: 14px;
    }
    .tab {
        background: transparent; border: 1px solid transparent; border-radius: 10px;
        color: var(--gold-dim); font-family: 'Noto Serif SC', serif;
        font-size: .88rem; padding: 7px 14px; cursor: pointer;
        transition: all .2s; letter-spacing: 1px;
    }
    .tab:hover { color: var(--gold-lt); background: rgba(90,63,34,.4); }
    .tab.active {
        background: linear-gradient(145deg, #6a4f2e, #4a3418);
        border-color: var(--gold); color: #fff3d8; font-weight: 700;
    }

    /* ===== 表单控件 ===== */
    .field { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
    .field > label { color: var(--ink-3); font-weight: 700; font-size: .9rem; letter-spacing: 1px; white-space: nowrap; }
    input[type=text], input[type=number], select, textarea {
        background: var(--bg-2);
        border: 1px solid #5a3f22;
        border-radius: 10px;
        padding: 9px 12px;
        color: var(--ink);
        font-size: .95rem;
        font-family: 'Noto Serif SC', serif;
        outline: none;
        transition: all .2s;
        box-shadow: inset 0 2px 6px rgba(0,0,0,.4);
    }
    input:focus, select:focus, textarea:focus {
        border-color: var(--gold);
        box-shadow: 0 0 18px rgba(180,140,80,.15), inset 0 2px 6px rgba(0,0,0,.4);
    }
    input::placeholder { color: #6a5a3e; font-style: italic; }
    select { cursor: pointer; }
    input[type=range] { accent-color: var(--gold); }

    .btn {
        background: linear-gradient(145deg, #4d3820, #2f1f0e);
        border: 1px solid #6a4f2e;
        border-radius: 10px;
        padding: 9px 20px;
        color: var(--gold-lt);
        font-family: 'Noto Serif SC', serif;
        font-weight: 700; font-size: .92rem;
        cursor: pointer; transition: all .25s;
        letter-spacing: 1px;
        box-shadow: 0 4px 12px rgba(0,0,0,.4);
        display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover {
        background: linear-gradient(145deg, #6a4f2e, #4d3820);
        border-color: #b8945a; transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(180,140,80,.2);
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: linear-gradient(145deg, #8a6a3a, #5a4020); border-color: #b8945a; }
    .btn-primary:hover { background: linear-gradient(145deg, #aa8a4a, #7a5a2a); }
    .btn-ghost { background: transparent; }
    .btn-sm { padding: 5px 12px; font-size: .82rem; }
    .btn-tool {
        background: #2f1f0e; border: 1px solid #5a3f22; border-radius: 6px;
        color: var(--gold-lt); font-size: .82rem; padding: 3px 8px; cursor: pointer;
        transition: all .15s; font-family: 'Noto Serif SC', serif;
    }
    .btn-tool:hover { background: #4d3820; border-color: #b8945a; }

    .toolbar {
        display: flex; flex-wrap: wrap; gap: 4px 8px; margin-bottom: 8px;
        padding: 8px 12px; background: rgba(20,14,6,.6);
        border-radius: 12px; border: 1px solid var(--line-soft);
    }
    .toolbar-group {
        display: flex; gap: 2px; align-items: center;
        padding-right: 10px; border-right: 1px solid var(--line-soft); margin-right: 6px;
    }
    .toolbar-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
    .toolbar-group label { color: var(--gold-dim); font-size: .68rem; margin-right: 4px; letter-spacing: 1px; }

    /* ===== 输出区 ===== */
    .output {
        background: #1a1008;
        border-radius: 14px; padding: 16px 18px;
        border: 1px solid var(--line-soft);
        min-height: 80px; max-height: 520px; overflow-y: auto;
        font-size: .95rem; line-height: 1.85; color: var(--ink-2);
        margin-top: 10px; white-space: pre-wrap; word-break: break-word;
        box-shadow: inset 0 4px 20px rgba(0,0,0,.5);
    }
    .output::-webkit-scrollbar { width: 6px; }
    .output::-webkit-scrollbar-track { background: var(--bg-2); border-radius: 10px; }
    .output::-webkit-scrollbar-thumb { background: #6a4f2e; border-radius: 10px; }

    /* ===== 提示 ===== */
    .note {
        overflow-wrap: break-word;
        border-left: 3px solid var(--gold); background: rgba(201,168,106,.07);
        padding: 9px 14px; border-radius: 0 10px 10px 0;
        font-size: .88rem; color: var(--ink-3); margin: 10px 0; line-height: 1.75;
    }
    .note.ok { border-color: var(--ok); background: rgba(122,199,122,.07); }
    .note.warn { border-color: var(--warn); background: rgba(234,206,106,.08); color: #f0e0a0; }
    .note.err { border-color: var(--err); background: rgba(217,122,90,.08); color: #f0b8a0; }
    .note b { color: var(--gold-lt); }

    .ok-text { color: var(--ok); }
    .err-text { color: var(--err); }
    .warn-text { color: var(--warn); }
    .muted { color: var(--muted); }
    .gold { color: var(--gold-lt); }
    .mono { font-family: 'Cambria Math', 'Times New Roman', serif; }

    /* ===== 键值表 ===== */
    .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: .92rem; }
    .kv .k { color: var(--gold-dim); text-align: right; }
    .kv .v { color: var(--ink-2); }

    /* ===== 卡片列表 ===== */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
        background: rgba(31,20,10,.7);
        border: 1px solid var(--line-soft);
        border-left: 3px solid #5a3f22;
        border-radius: 8px 12px 12px 8px;
        padding: 10px 14px;
        transition: all .2s;
    }
    .item:hover { border-left-color: var(--gold); background: rgba(61,43,24,.5); transform: translateX(2px); }
    .item.clickable { cursor: pointer; }
    .item-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .item-title { color: var(--gold-lt); font-weight: 700; font-size: .98rem; }
    .item-desc { color: var(--ink-3); font-size: .85rem; margin-top: 4px; line-height: 1.7; overflow-wrap: break-word; }

    .tag {
        display: inline-block; background: #2f1f0e; border: 1px solid #5a3f22;
        border-radius: 6px; padding: 1px 9px; font-size: .74rem; color: var(--ink-3);
    }
    .tag-gold { border-color: #b8945a; color: var(--gold-lt); background: #3d2b18; }
    .tag-ok { border-color: #4a7a4a; color: var(--ok); background: rgba(74,122,74,.12); }
    .tag-err { border-color: #8a3a2a; color: var(--err); background: rgba(138,58,42,.12); }
    .tag-warn { border-color: #8a7a2a; color: var(--warn); background: rgba(138,122,42,.12); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
        background: #2f1f0e; border: 1px solid #5a3f22; border-radius: 20px;
        padding: 4px 12px; font-size: .82rem; color: var(--ink-3); cursor: pointer;
        transition: all .2s;
    }
    .chip:hover { border-color: var(--gold); color: var(--gold-lt); background: #4d3820; }

    /* ===== 表格 ===== */
    .tbl-wrap { overflow-x: auto; margin-top: 10px; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
    table.tbl th {
        text-align: left; color: var(--gold); font-weight: 700; letter-spacing: 1px;
        padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
        background: rgba(40,26,14,.6); position: sticky; top: 0;
    }
    table.tbl td { padding: 7px 10px; border-bottom: 1px solid rgba(61,43,24,.7); color: var(--ink-2); vertical-align: top; overflow-wrap: break-word; }
    table.tbl tr:hover td { background: rgba(61,43,24,.35); }
    table.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }

    /* ===== 统计卡 ===== */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 10px; margin: 12px 0; }
    .stat-card {
        background: linear-gradient(160deg, rgba(61,43,24,.7), rgba(31,20,10,.7));
        border: 1px solid var(--line); border-radius: 12px; padding: 12px 10px; text-align: center;
    }
    .stat-card .n { font-size: 1.5rem; color: var(--gold-lt); font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-card .l { font-size: .75rem; color: var(--muted); letter-spacing: 2px; margin-top: 2px; }

    /* ===== 周期表 ===== */
    .ptable { display: grid; grid-template-columns: repeat(18, minmax(44px, 1fr)); gap: 4px; margin: 12px 0; }
    .ptable .el {
        background: #2f1f0e; border: 1px solid var(--line); border-radius: 6px;
        padding: 4px 1px; text-align: center; font-size: .66rem; cursor: pointer;
        transition: all .2s; color: var(--ink-3); min-height: 46px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        line-height: 1.15;
    }
    .ptable .el:hover { transform: scale(1.12); border-color: var(--gold); z-index: 3; box-shadow: 0 6px 18px rgba(0,0,0,.6); }
    .ptable .el .sym { font-weight: 700; font-size: .8rem; color: #f5e6c8; }
    .ptable .el .num { font-size: .52rem; opacity: .7; }
    .ptable .empty { background: transparent; border: none; }

    /* ===== 练习 ===== */
    .opt {
        display: block; width: 100%; text-align: left;
        background: var(--bg-2); border: 1px solid var(--line-soft); border-radius: 10px;
        padding: 10px 16px; margin: 6px 0; cursor: pointer; color: var(--ink-2);
        font-family: 'Noto Serif SC', serif; font-size: .95rem; transition: all .18s;
    }
    .opt:hover { background: #3d2b18; border-color: #6a4f2e; transform: translateX(3px); }
    .opt.correct { border-color: #4a8a4a; background: rgba(46,90,46,.35); }
    .opt.wrong { border-color: #8a3a2a; background: rgba(90,30,20,.35); }
    .opt.disabled { cursor: default; }
    .progress-bar { height: 4px; background: #2f1f0e; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
    .progress-bar > div { height: 100%; background: linear-gradient(90deg, #8a6a3a, #c9a86a); transition: width .3s; }

    /* ===== 模态框 ===== */
    .modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,.82);
        display: none; justify-content: center; align-items: center;
        z-index: 999; backdrop-filter: blur(6px); padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
        background: #2b1e0e; border: 2px solid #b8945a; border-radius: 26px;
        max-width: 680px; width: 100%; max-height: 82vh; overflow-y: auto;
        padding: 28px 32px; box-shadow: 0 40px 100px rgba(0,0,0,.9);
        position: relative; animation: modalIn .25s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(.94) translateY(14px); } to { opacity: 1; transform: none; } }
    .modal-box .close-btn {
        position: absolute; top: 12px; right: 18px; font-size: 1.5rem; cursor: pointer;
        color: var(--gold-dim); background: none; border: none; font-family: inherit; transition: all .2s;
    }
    .modal-box .close-btn:hover { color: var(--err); transform: rotate(90deg); }

    .loading { color: var(--gold-dim); text-align: center; padding: 40px 0; letter-spacing: 2px; }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, #6a4f2e, #b8945a, #6a4f2e, transparent); margin: 16px 0; opacity: .35; }

    /* ===== 响应式 ===== */
    @media (max-width: 860px) {
        .scroll-container { padding: 16px 12px; border-radius: 24px; border-width: 4px; }
        .main-title { font-size: 2rem; letter-spacing: 6px; }
        .menu-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .menu-btn { font-size: .82rem; padding: 10px 2px; }
        .panel { padding: 16px 14px; }
        .panel-title { font-size: 1.4rem; }
        .ptable { grid-template-columns: repeat(18, minmax(26px, 1fr)); gap: 2px; }
        .ptable .el { font-size: .48rem; min-height: 30px; }
        .ptable .el .sym { font-size: .58rem; }
        .kv { grid-template-columns: max-content 1fr; font-size: .85rem; }
        .screen-seal { display: none; }
    }
    @media (max-width: 480px) {
        .main-title { font-size: 1.6rem; letter-spacing: 3px; }
        .menu-grid { grid-template-columns: repeat(2, 1fr); }
        .tab { padding: 6px 10px; font-size: .8rem; }
    }
</style>
</head>
<body>

<div class="scroll-container" id="app">
        <div class="main-title">
        化学世界
        <span class="seal">雅集</span>
        <small>· 古 风 卷 轴 ·</small>
    </div>
    <div class="sub-charm">格物致知 · 化育万物</div>
    <div class="badge-row"><span class="data-badge" id="dataBadge">载入中</span></div>

    <div class="menu-group">
        <div class="group-label">卷 首</div>
        <div class="menu-grid">
            <button class="menu-btn" data-page="home"><span class="icon">🏮</span>卷首</button>
            <button class="menu-btn" data-page="periodic"><span class="icon">⚗</span>周期表</button>
            <button class="menu-btn" data-page="balance"><span class="icon">⚡</span>化学式配平</button>
            <button class="menu-btn" data-page="molecules"><span class="icon">🧪</span>分子查询</button>
            <button class="menu-btn" data-page="weight"><span class="icon">⚖</span>分子量计算</button>
        </div>
    </div>

    <div class="menu-group">
        <div class="group-label">分 篇</div>
        <div class="menu-grid">
            <button class="menu-btn" data-page="acidbase"><span class="icon">🧫</span>酸碱世界</button>
            <button class="menu-btn" data-page="organic"><span class="icon">🧬</span>有机天地</button>
